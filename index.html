<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PontoWeb - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="login-wrapper">
    <div class="card login-card">
      <div class="login-logo">
        <h1>PontoWeb</h1>
        <p>Faça login para registrar seu ponto</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" id="email" class="form-input" placeholder="seu@email.com" required>
        </div>
        
        <div class="form-group">
          <label for="password" class="form-label">Senha</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="btn-login">
          Entrar no Sistema
        </button>
        
        <div id="error-message" class="mt-2 text-center hidden" style="color: var(--danger); font-size: 0.875rem;">
          Credenciais inválidas. Tente novamente.
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase Setup -->
  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
